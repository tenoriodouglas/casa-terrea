# Re-renders the photorealistic images and 360 panoramas whenever the house model changes.
# The new set replaces the old one only after every image rendered successfully.
name: Render images

on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/render/**']
  workflow_dispatch:

concurrency:
  group: render
  cancel-in-progress: true   # a newer version supersedes a render in progress

permissions:
  contents: write
  pages: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          pip install bpy playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render and swap
        run: python tools/render/build.py

      - name: Commit new renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders model
          git diff --cached --quiet && exit 0
          git commit -m "Update renders for $(git rev-parse --short HEAD) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
